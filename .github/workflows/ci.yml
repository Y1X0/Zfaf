name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # Stage 1 — fast checks. Everything here fails within ~2 minutes, so a broken
  # PR never burns time on the slower stages.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the diff

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      # A manifest naming a variant the registry does not have would render as
      # a fallback rather than as designed. Catching it here means a template
      # cannot be merged in that state (ADR-0004).
      - name: Validate shipped template manifests
        run: pnpm template:validate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 — tests.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  # Integration tests run against a real PostgreSQL. Partial unique indexes,
  # immutability triggers and transaction isolation have no meaningful mock —
  # a fake would report success for exactly the cases most likely to be wrong.
  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zfaf
          POSTGRES_PASSWORD: zfaf_ci
          POSTGRES_DB: zfaf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zfaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A real S3 API, so the storage contract suite runs against something
      # that signs and rejects for real rather than only against the in-memory
      # adapter (ADR-0007 amendment).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: zfafci
          MINIO_ROOT_PASSWORD: zfafcisecret
          MINIO_DEFAULT_BUCKETS: zfaf-media
        ports: ['9000:9000']
        options: >-
          --health-cmd "mc ready local || curl -f http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://zfaf:zfaf_ci@127.0.0.1:5432/zfaf?schema=public
      S3_TEST_DRIVER: minio
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: zfaf-media
      S3_TEST_ACCESS_KEY_ID: zfafci
      S3_TEST_SECRET_ACCESS_KEY: zfafcisecret
      S3_TEST_REGION: us-east-1
      S3_TEST_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zfaf/db db:generate

      # Applies every migration from an empty database — the same path a new
      # environment takes, not just the current schema.
      - name: Apply migrations
        run: pnpm --filter @zfaf/db db:deploy

      - name: Integration tests
        run: pnpm test:integration

      # The same contract suite the unit job runs against the in-memory
      # adapter, now against a live S3 API. A behaviour that holds for only one
      # implementation shows up here.
      - name: Storage contract tests against a live S3 API
        run: pnpm exec vitest run packages/infra/src/storage

  # Proves the architectural guardrails actually fail the build. A rule that is
  # configured but not verified is a rule nobody knows is broken.
  guardrails:
    name: Architecture guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Guardrails must reject known violations
        run: bash scripts/verify-guardrails.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Critical and high severity fail the build; lower severities are
      # triaged through Dependabot rather than blocking every PR.
      - name: Audit
        run: pnpm audit --audit-level high
